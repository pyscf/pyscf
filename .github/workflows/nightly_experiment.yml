name: Nightly experiment

on:
  push:
    branches:
      - 'nightly-veryhigh-cost'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Mirrors the nightly linux-tests job, minus the _veryhigh_cost tests.
  linux-tests:    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      # Let xdist choose one worker per detected CPU core.
      PYTEST_JOBS: auto
      INSTALL_NIGHTLY_DEPS: 'true'
      RUN_COVERAGE: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build and run tests including high-cost cases
        run: |
          set -o pipefail
          ./.github/workflows/run_ci.sh -k "not _skip and not _veryhigh_cost" --timeout=3600 --junitxml=nightly-tests.xml 2>&1 | tee nightly-tests.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-experiment-linux-test-results
          path: |
            nightly-tests.log
            nightly-tests.xml
            coverage.xml
          retention-days: 14

  # Dedicated job for _veryhigh_cost tests: 4 BLAS threads, longer timeout.
  linux-tests-veryhigh:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
      PYTEST_JOBS: 1
      INSTALL_NIGHTLY_DEPS: 'true'
      RUN_COVERAGE: 'true'
      TEST_PATHS: 'pyscf/hessian/test/test_vv10_hessian.py pyscf/tdscf/test/test_tdrks_vv10.py'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run very high cost tests
        run: |
          set -o pipefail
          ./.github/workflows/run_ci.sh -k "_veryhigh_cost" --timeout=10800 --junitxml=veryhigh-tests.xml 2>&1 | tee veryhigh-tests.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-experiment-veryhigh-results
          path: |
            veryhigh-tests.log
            veryhigh-tests.xml
          retention-days: 14
