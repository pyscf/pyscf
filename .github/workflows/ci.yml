# Mirror the path filters of ci-windows.yml: CI runs only when files that can
# affect the build or the tests change, so doc/example/tooling-only PRs do not
# occupy runners. workflow_dispatch forces a run that the filters skipped.
on:
  push:
    paths:
      - ".coveragerc"
      - ".codecov.yml"
      - ".gitattributes"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ci_linux/**"
      - ".github/workflows/ci_macos/**"
      - ".github/workflows/run_ci.sh"
      - ".github/workflows/run_tests.sh"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "pyscf/**"
      - "pytest.ini"
      - "setup.py"
  pull_request:
    paths:
      - ".coveragerc"
      - ".codecov.yml"
      - ".gitattributes"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ci_linux/**"
      - ".github/workflows/ci_macos/**"
      - ".github/workflows/run_ci.sh"
      - ".github/workflows/run_tests.sh"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "pyscf/**"
      - "pytest.ini"
      - "setup.py"
  workflow_dispatch:

# Superseded runs on a branch are cancelled rather than left to finish; pushing
# twice in quick succession otherwise leaves two multi-hour runs competing for
# runners. Runs on master are always allowed to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  linux-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and Test
        run: ./.github/workflows/run_ci.sh

  # The job above runs every worker single threaded, which leaves the OpenMP
  # kernels untested. This one keeps threads on so that threaded code paths are
  # still covered, over the modules whose C extensions actually contain OpenMP
  # pragmas, and skips the slow ones to stay well inside the main job's runtime.
  linux-build-multithread:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 2
      PYTEST_JOBS: 2
      TEST_PATHS: >-
        pyscf/agf2 pyscf/ao2mo pyscf/cc pyscf/dft pyscf/gto pyscf/lib
        pyscf/mcpdft pyscf/mcscf pyscf/mp pyscf/scf pyscf/tdscf
        pyscf/pbc/df pyscf/pbc/dft pyscf/pbc/scf
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install and Test
        run: ./.github/workflows/run_ci.sh

  linux-build-aarch64:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04-arm]
        python-version: ["3.9"]
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      BLIS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and Test
        run: >-
          ./.github/workflows/run_ci.sh
          --ignore=pyscf/adc --ignore=pyscf/pbc/df --ignore=pyscf/pbc/cc -v

  macos-build:
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and Test
        run: ./.github/workflows/run_ci.sh
