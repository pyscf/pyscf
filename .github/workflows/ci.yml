name: CI

#FIXME: workflow dependency not working on non-default branch?
#on:
#  workflow_run:
#    workflows:
#      - Lint
#    types:
#      - completed
on: [push, pull_request]

# Superseded runs on a branch are cancelled rather than left to finish; pushing
# twice in quick succession otherwise leaves two multi-hour runs competing for
# runners. Runs on master are always allowed to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  linux-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and Test
        run: ./.github/workflows/run_ci.sh
      - name: Upload to codecov
        if: matrix.python-version == '3.8' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}

  # The job above runs every worker single threaded, which leaves the OpenMP
  # kernels untested. This one keeps threads on so that threaded code paths are
  # still covered, over the modules whose C extensions actually contain OpenMP
  # pragmas, and skips the slow ones to stay well inside the main job's runtime.
  linux-build-multithread:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: 2
      PYTEST_JOBS: 2
      TEST_PATHS: >-
        pyscf/agf2 pyscf/ao2mo pyscf/cc pyscf/dft pyscf/gto pyscf/lib
        pyscf/mcpdft pyscf/mcscf pyscf/mp pyscf/scf pyscf/tdscf
        pyscf/pbc/df pyscf/pbc/dft pyscf/pbc/scf
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install and Test
        run: ./.github/workflows/run_ci.sh

  linux-build-aarch64:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        pyver: [cp39-cp39]
    env:
      img: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
      - name: Build Wheel
        run: |
            docker run --rm -v ${{ github.workspace }}:/src/pyscf:rw --workdir=/src/pyscf ${{ env.img }} \
            bash -exc '/opt/python/${{ matrix.pyver }}/bin/pip install --upgrade pip setuptools && \
            /opt/python/${{ matrix.pyver }}/bin/pip install "numpy!=1.16,!=1.17" "scipy!=1.5" h5py==3.10 pytest pytest-cov pytest-timer pyberny geometric && \
            yum install -y epel-release && \
            yum-config-manager --enable epel && \
            yum install -y openblas-devel gcc cmake curl && \
            cd ./pyscf/lib && curl -o deps.tar.gz -L "https://github.com/pyscf/pyscf-build-deps/blob/master/pyscf-2.2-aarch64-deps.tar.gz?raw=true"  && \
            tar xzf deps.tar.gz && \
            mkdir build && cd build && \
            cmake -DBUILD_LIBXC=OFF -DBUILD_XCFUN=OFF -DBUILD_LIBCINT=OFF .. && \
            make -j2 && cd .. && rm -Rf build && cd ../.. && \
            export OMP_NUM_THREADS=1 && export PYTHONPATH=$(pwd):$PYTHONPATH && \
            echo 'pbc_tools_pbc_fft_engine = "NUMPY"' > .pyscf_conf.py && \
            echo "dftd3_DFTD3PATH = './pyscf/lib/deps/lib'" >> .pyscf_conf.py && \
            echo "scf_hf_SCF_mute_chkfile = True" >> .pyscf_conf.py && \
            ulimit -s 20000 && /opt/python/${{ matrix.pyver }}/bin/pytest pyscf/ --ignore=pyscf/adc --ignore=pyscf/pbc/df --ignore=pyscf/pbc/cc -s -c pytest.ini pyscf'

  macos-build:
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and Test
        run: ./.github/workflows/run_ci.sh
