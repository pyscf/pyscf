exclude = [
    "test",
    "doc_legacy",
]

respect-gitignore = true
line-length = 120

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
#select = ["E4", "E7", "E9", "F"]
ignore = [
# Whitespaces:
"E201", "E202", "E203", "E211", "E221", "E222", "E225", "E226", "E228", "E231", "E241", "E251",
# Comments:
"E261", "E262", "E265", "E266",
# Blank lines:
"E301", "E302", "E303", "E305", "E306",
# Imports:
"E401", "E402",
# Other:
"E701", "E713", "E721", "E731", "E741", "E275",
    "F401", "F403", "C901", "W391",

    # ==================================================================
    # ruff 0.16 additions — safe to fix, deferred
    # ==================================================================
    "B009",     # getattr with constant → attribute access
    "PIE808",   # range(0, n) → range(n)
    "FURB122",  # .write() in loop → .writelines()
    "W605",     # invalid escape sequences (all in examples/)
    "SIM114",   # combine identical if-else branches
    "PIE790",   # unnecessary pass
    "C408",     # tuple()/list()/dict() → literal
    "SIM118",   # key in dict.keys() → key in dict
    "PLR1736",  # list index lookup in enumerate loop
    "SIM113",   # use enumerate() for manual index
    "PLR1716",  # chain boolean comparison
    "RUF051",   # d.pop(k, None)
    "RET501",   # return None → return
    "FLY002",   # join → f-string
    "RUF010",   # repr(x) → x!r in f-strings
    "FURB105",  # print('') → print()
    "C405",     # set(tuple) → {set}
    "SIM101",   # merge isinstance calls (same as PLR1711)
    "PLR1711",  # merge isinstance calls (style)
    "UP034",    # non-PEP-585 annotations (needs from __future__)
    "I001",     # import sorting (noisy diff)
    "UP031",    # percent formatting (mostly examples)
    "SIM102",   # nested if merge (style)
    "B006",     # mutable default args (None-then-init pattern)
    "B023",     # functions in loops (all false positives)
    "UP036",    # outdated Python version blocks
    "SIM401",   # d.get(k, default) instead of if-else
    "RUF022",   # sort __all__ alphabetically
    "PIE810",   # single startswith/endswith with tuple
    "SIM117",   # merge nested with statements
    "UP028",    # yield from instead of yield
    "UP018",    # shorthand type(...)
    "SIM201",   # not a or not b instead of not (a and b)
    "SIM103",   # use return for simple conditional
    "UP030",    # implicit positional format references

    # ==================================================================
    # ruff 0.16 additions — bug risk / need review
    # ==================================================================
    "EXE001",   # shebangs in example scripts (not executables)
    "B008",     # function call in defaults (intentional PySCF idiom)
    "RUF059",   # unpacked variables unused (mostly benign)
    "RUF012",   # _keys sets (intentional serialization metadata)
    "RUF100",   # unused noqa (flake8/ruff disagreement)
    "TRY004",   # TypeError vs RuntimeError (could break handlers)
    "SIM115",   # context manager for files (would close prematurely)
    "BLE001",   # blind except Exception (could hide real errors)
    "PLR1704",  # redefining argument (may mask real bugs)
    "TRY002",   # bare Exception → custom (needs per-site classes)
    "TRY201",   # raise e → bare raise (changes traceback)
    "SIM223",   # False and ... (intentional dead feature gate)
    "PLR1722",  # exit() → sys.exit() (not auto-fixable)
    "D419",     # empty docstring (needs content)
    "PLR0206",  # property with extra param (intentional caching)
    "PLW1508",  # invalid env var default type (works in practice)
    "PLW0642",  # reassigned self (intentional decorator)
    "ISC004",   # unparenthesized string concat (bug was fixed)
    "TRY203",   # dead try/except (bug was fixed)
    "PLW0128",  # redeclared variable in unpack (likely intentional)
    "N999",     # invalid module names (historical, cannot rename)
    "PLC0206",  # property returns non-callable (code smell)
    "PLW0127",  # self-assignment (potential real bugs)
    "B018",     # useless expression (needs per-site judgment)
    "S110",     # try-except-pass (intentional error suppression)
    "S102",     # exec() (intentional in __config__.py and misc.py)
    "PLW0406",  # module imports itself (intentional pattern)
    "PLC0414",  # import alias not first-party
    "PERF102",  # list() vs list comprehension (style)
    "FA100",    # missing from __future__ import annotations
    "B020",     # loop variable overrides outer (actual bug risk)
    "PYI036",   # missing __future__ annotations in stub
    "PYI006",   # use type instead of Type
]

[lint.per-file-ignores]
"pyscf/adc/radc_ao2mo.py" = ["E501"]
"pyscf/adc/uadc_ao2mo.py" = ["E501"]
"pyscf/gto/mole.py" = ["E501"]
"pyscf/pbc/cc/eom_kccsd_rhf.py" = ["E501"]
"pyscf/pbc/cc/kintermediates_uhf.py" = ["E501"]
"pyscf/pbc/gto/cell.py" = ["E501"]
"pyscf/solvent/ddcosmo.py" = ["E501"]
"pyscf/solvent/grad/ddcosmo_grad.py" = ["E501"]

[format]
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

quote-style = "single"
