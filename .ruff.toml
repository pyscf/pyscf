exclude = [
    "test",
    "doc_legacy",
]

respect-gitignore = true
line-length = 120

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
#select = ["E4", "E7", "E9", "F"]
ignore = [
# Whitespaces:
"E201", "E202", "E203", "E211", "E221", "E222", "E225", "E226", "E228", "E231", "E241", "E251",
# Comments:
"E261", "E262", "E265", "E266",
# Blank lines:
"E301", "E302", "E303", "E305", "E306",
# Imports:
"E401", "E402",
# Other:
"E701", "E713", "E721", "E731", "E741", "E275",
    "F401", "F403", "C901", "W391",
    # ruff 0.16 additions:
    # EXE001: shebangs in example scripts (documentation, not binaries)
    "EXE001",
    # B008: function calls in defaults are idiomatic in PySCF (e.g. getattr, np.zeros)
    "B008",
    # UP031: percent-formatting, overwhelmingly in examples — noisy, not a bug
    "UP031",
    # PLR1711: merging isinstance calls is a style preference
    "PLR1711",
    # UP034: non-PEP-585 annotations require from __future__ imports across many files
    "UP034",
    # RUF059: unpacked variables unused (e.g. nocc, nvir = shape where nvir unused), mostly benign
    "RUF059",
    # I001: import sorting — adds blank lines between sections, noisy diff
    "I001",
    # RUF012: mutable class attributes — _keys sets are intentional serialization metadata
    "RUF012",
    # RUF100: unused noqa — flake8 needs noqa comments that ruff doesn't agree on
    "RUF100",
    # B023: functions in loops — all false positives (consumed sync within same iteration)
    "B023",
    # B006: mutable default args — mostly intentional defaults in library code
    "B006",
    # SIM102: nested if → single if with and — style preference
    "SIM102",
    # TRY004: TypeError instead of RuntimeError — semantic change, could break handlers
    "TRY004",
    # B009: getattr with constant attribute — style preference
    "B009",
    # PIE808: range(0, n) → range(n) — trivial, not worth diff
    "PIE808",
    # FURB122: .write() in for-loop → .writelines() — all in pywannier90.py/chgcar.py
    "FURB122",
    # W605: invalid escape sequences — all in examples/, zero in pyscf/
    "W605",
    # SIM115: context manager for files — long-lived handles, with would close prematurely
    "SIM115",
    # SIM114: combine identical if-else bodies — intentional separate branches
    "SIM114",
    # BLE001: blind except Exception — requires per-site knowledge to fix properly
    "BLE001",
    # PLR1704: redefining argument with local name — may mask real bugs
    "PLR1704",
    # PIE790: unnecessary pass — style preference
    "PIE790",
    # C408: tuple()/dict()/list() → literal — trivial, manual change
    "C408",
    # TRY002: bare Exception → custom exception — needs per-site exception classes
    "TRY002",
    # TRY201: raise e → bare raise — changes traceback semantics
    "TRY201",
    # SIM118: key in dict.keys() → key in dict — explicit intent
    "SIM118",
    # PLR1736: list index lookup in enumerate loop — safe fix, defer
    "PLR1736",
    # SIM113: use enumerate() for manual index — manual refactor needed
    "SIM113",
    # PLR1716: chain boolean comparison — safe fix, defer
    "PLR1716",
    # SIM223: False and ... → False — intentional dead feature gate code
    "SIM223",
    # RUF051: if k in d: del d[k] → d.pop(k, None) — defer
    "RUF051",
    # RET501: return None → return — defer
    "RET501",
    # FLY002: join → f-string — cosmetic
    "FLY002",
    # UP036: outdated Python version blocks — needs per-site review
    "UP036",
    # PLR1722: exit() → sys.exit() — not auto-fixable
    "PLR1722",
    # D419: empty docstring — defer
    "D419",
    # PLR0206: property with extra parameter — intentional caching pattern
    "PLR0206",
    # PLW1508: invalid env var default type — works in practice
    "PLW1508",
    # PLW0642: reassigned self — intentional decorator pattern
    "PLW0642",
    # ISC004, TRY203: fixed genuine bugs
    "ISC004",
    "TRY203",
]

[lint.per-file-ignores]
"pyscf/adc/radc_ao2mo.py" = ["E501"]
"pyscf/adc/uadc_ao2mo.py" = ["E501"]
"pyscf/gto/mole.py" = ["E501"]
"pyscf/pbc/cc/eom_kccsd_rhf.py" = ["E501"]
"pyscf/pbc/cc/kintermediates_uhf.py" = ["E501"]
"pyscf/pbc/gto/cell.py" = ["E501"]
"pyscf/solvent/ddcosmo.py" = ["E501"]
"pyscf/solvent/grad/ddcosmo_grad.py" = ["E501"]

[format]
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

quote-style = "single"
